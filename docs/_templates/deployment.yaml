yaml
# What to deploy for this ticket, in order. Every ticket that ships code carries one.
# Update it in the same pass as any change that adds a DB object, touches a deployable
# service, or needs a config key. An empty list means "checked, none" - never leave a key out.

ticket:  ISSUE-NNNN
updated: YYYY-MM-DD

# Run top to bottom. A step that needs an earlier one names it in depends_on.
steps:

  - order: 1
    type: database                        # database | api | ui | web | function | job
    script: ISSUE-NNNN_DB_Deployment.sql  # in this folder; re-runnable; Prod (and staging) only
    dev_script: ISSUE-NNNN_DB_Deployment_Dev.sql   # dev only - dev body + this ticket's change
    repo: Database
    branch: ISSUE-NNNN
    git_state: staged, not committed      # staged | committed <sha> | pushed <sha> | merged
    verified: "verify_db_deployment_script.py - ALL MATCH, N procs (YYYY-MM-DD)"
    dev_verified: "build_dev_deployment_script.py --check - DEV OK, N procs, snapshot YYYY-MM-DD"
    objects:
      tables: []                          # Table.Column TYPE for each new/changed column
      procedures: []
      triggers: []
    note: >
      Ordering constraint, if any (e.g. must go before the web code because ...).

  - order: 2
    type: api
    name: <service name>
    repo: Caresmartz360Next
    project: <Folder/Project.csproj>
    branch: ISSUE-NNNN
    git_state: staged, not committed
    depends_on: [1]
    why: <endpoint or behaviour this deploy carries>
    appsettings: []                       # keys this service needs, see config_keys

not_deployed: []                          # - name: BFF / reason: why it needs no deploy

# Every appsettings.json / web.config / environment.ts / pipeline variable this ticket adds.
config_keys: []
#  - key: FeatureFlagService
#    file: ThirdPartyAPI/appsettings.json
#    service: ThirdPartyAPI
#    values:
#      dev: https://localhost:7162
#      staging: <ask DevOps>
#      production: <ask DevOps>
#    secret: false                        # true -> goes to Key Vault, never into the file

smoke_test: []                            # one line per check to run right after deploy

