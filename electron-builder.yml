appId: com.aicontextbridge.app
productName: AI Context Bridge
directories:
  output: dist
  # Icons and other build inputs; `build/` is ignored by git. Regenerate with `npm run icon`.
  buildResources: resources
files:
  - out/**/*
  - package.json
  # Tesseract uses only the 4.0.0_best_int English model; skip the larger legacy model.
  - "!node_modules/@tesseract.js-data/eng/4.0.0/**"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AI-Context-Bridge-Setup-${version}.${ext}
  icon: resources/icon.ico
nsis:
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
